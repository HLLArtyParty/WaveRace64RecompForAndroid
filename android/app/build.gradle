plugins { id 'com.android.application' }

def rootDirPort = rootProject.projectDir.parentFile
def upstream = new File(rootDirPort, 'upstream')
def sdlPrefix = System.getenv('WR64_ANDROID_SDL2_PREFIX') ?: new File(rootDirPort, '.android-prefixes/SDL2-2.32.10-android-arm64').absolutePath
def ftPrefix = System.getenv('WR64_ANDROID_FREETYPE_PREFIX') ?: new File(rootDirPort, '.android-prefixes/freetype-2.13.3-android-arm64').absolutePath
def fileToC = System.getenv('WR64_ANDROID_FILE_TO_C') ?: new File(rootDirPort, 'build-host-tools/file_to_c').absolutePath
def generatedJni = layout.buildDirectory.dir('generated/jniLibs').get().asFile
def stagedAssets = layout.buildDirectory.dir('generated/assets').get().asFile

android {
    namespace 'com.hllartyparty.waverace64recomp'
    compileSdk 35
    ndkVersion '27.1.12297006'

    defaultConfig {
        applicationId 'com.hllartyparty.waverace64recomp'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.0.1-bringup'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_PLATFORM=android-28', '-DANDROID_STL=c++_shared',
                    "-DCMAKE_PREFIX_PATH=${sdlPrefix};${ftPrefix}",
                    "-DSDL2_DIR=${sdlPrefix}/lib/cmake/SDL2",
                    "-DFREETYPE_LIBRARY=${ftPrefix}/lib/libfreetype.a",
                    "-DFREETYPE_INCLUDE_DIRS=${ftPrefix}/include/freetype2",
                    "-DZELDA_HOST_FILE_TO_C=${fileToC}",
                    '-DWR64_WITH_RUNTIME=ON', '-DWR64_WITH_RECOMPILED=ON', '-DWR64_WITH_FRONTEND=ON',
                    '-DCMAKE_BUILD_TYPE=RelWithDebInfo'
                cppFlags '-O2', '-g', '-DNDEBUG'
                cFlags '-O2', '-g', '-DNDEBUG'
                targets 'WaveRace64Recomp'
            }
        }
    }

    buildTypes { debug { ndk { debugSymbolLevel 'SYMBOL_TABLE' } } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    externalNativeBuild { cmake { path new File(upstream, 'CMakeLists.txt'); version '3.22.1' } }
    sourceSets { main { jniLibs.srcDirs = [generatedJni]; assets.srcDirs = [stagedAssets] } }
    packaging { jniLibs { useLegacyPackaging true } }
}

tasks.register('stageNativeRuntime', Copy) {
    from("${sdlPrefix}/lib/libSDL2.so")
    into(new File(generatedJni, 'arm64-v8a'))
}

tasks.register('stageProgramAssets') {
    doLast {
        delete stagedAssets
        def programAssets = new File(stagedAssets, 'program/assets')
        programAssets.mkdirs()
        copy { from new File(upstream, 'assets/recomp.rcss'); into programAssets }
        copy { from new File(upstream, 'assets/icons'); into new File(programAssets, 'icons') }
        copy { from new File(upstream, 'assets/promptfont'); into new File(programAssets, 'promptfont') }
        copy { from new File(upstream, 'assets/water'); into new File(programAssets, 'water') }
        def rml = new File(upstream, 'lib/RecompFrontend/recompui/lib/RmlUi/Samples/assets')
        ['LatoLatin-Regular.ttf','LatoLatin-Bold.ttf','LatoLatin-Italic.ttf','NotoEmoji-Regular.ttf'].each { f ->
            copy { from new File(rml, f); into programAssets }
        }
    }
}

tasks.named('preBuild') { dependsOn 'stageNativeRuntime', 'stageProgramAssets' }
