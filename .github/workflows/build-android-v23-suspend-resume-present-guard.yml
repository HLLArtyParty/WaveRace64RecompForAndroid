          rt = Path("upstream/lib/N64ModernRuntime")
          ev = str(rt / "ultramodern/src/events.cpp")
          edit(ev, "#include <mutex>\n", "#include <mutex>\n#include <condition_variable>\n", "pause CV include")
          edit(ev, "struct SpTaskAction {", "// App lifecycle pause gate. See ultramodern.hpp for the contract.\nextern std::atomic_bool exited;\nnamespace {\n    std::atomic<bool> app_paused{false};\n    std::mutex app_pause_mutex;\n    std::condition_variable app_pause_cv;\n}\n\nvoid ultramodern::set_app_paused(bool paused) {\n    {\n        std::lock_guard<std::mutex> lock(app_pause_mutex);\n        app_paused.store(paused);\n    }\n    app_pause_cv.notify_all();\n}\n\n// Shutdown seam for the pause gate. quit() (librecomp) calls this instead of\n// writing `exited` itself, so `exited` is stored UNDER app_pause_mutex -- the\n// same mutex wait_while_app_paused()'s predicate reads it under. That closes the\n// lost-wakeup window structurally: a waiter cannot evaluate the predicate as\n// false and then park in the gap before the flag-set + notify, because the store\n// and the waiter's predicate eval are serialized by the mutex. This is the ONLY\n// write site for `exited`; keep it that way (don't add a bare exited.store\n// elsewhere) or the guarantee is void. notify_all() is intentionally after the\n// unlock: store-under-lock is what fixes the race; notifying post-unlock is the\n// idiomatic form (woken waiters don't immediately re-block on a held mutex).\nvoid ultramodern::set_exited_and_wake() {\n    {\n        std::lock_guard<std::mutex> lock(app_pause_mutex);\n        exited.store(true);\n    }\n    app_pause_cv.notify_all();\n}\n\nbool ultramodern::is_app_paused() {\n    return app_paused.load();\n}\n\n// Called by the VI thread at a safe point: blocks while the app is paused.\n// Wakes on unpause OR on shutdown (exited) so join_event_threads() can never\n// deadlock waiting for a parked VI thread. Returns true if the caller should\n// bail out because the app is exiting.\n//\n// The under-lock predicate is the SOLE gate (no unlocked pre-check): wait()\n// evaluates it before sleeping, so there is no TOCTOU window on app_paused /\n// exited between an early check and parking. When neither is set the predicate\n// is false and we simply don't sleep, so the common (running) path is still\n// just one mutex acquire + predicate eval per frame.\nstatic bool wait_while_app_paused() {\n    std::unique_lock<std::mutex> lock(app_pause_mutex);\n    app_pause_cv.wait(lock, [] { return !app_paused.load() || exited.load(); });\n    return exited.load();\n}\n\n" + "struct SpTaskAction {", "pause gate")
          edit(ev, "    while (!exited) {\n        // Determine the next VI time", "    while (!exited) {\n        if (wait_while_app_paused()) {\n            break;\n        }\n        // Determine the next VI time", "VI pause point")
          hdr = str(rt / "ultramodern/include/ultramodern/ultramodern.hpp")
          edit(hdr, "void quit();\n", "void quit();\nvoid set_app_paused(bool paused);\nbool is_app_paused();\nvoid set_exited_and_wake();\n", "runtime declarations")
          edit(str(rt / "librecomp/src/recomp.cpp"), "    exited.store(true);", "    set_exited_and_wake();", "wake paused VI on quit")

          cb = "upstream/src/callbacks.cpp"
          edit(cb, "#if defined(_WIN32) || defined(__APPLE__)\n#   include <SDL_syswm.h>", "#if defined(_WIN32) || defined(__APPLE__) || defined(__ANDROID__)\n#   include <SDL_syswm.h>", "SDL Android WM header")
          edit(cb, "namespace {\n\nSDL_Window* g_window", "namespace wr64_android { void publish_resume_window(void*); }\n\nnamespace {\n\nSDL_Window* g_window", "resume declaration")
          event_cases = '''            case SDL_APP_WILLENTERBACKGROUND:
                          std::fprintf(stderr, "[wr64-android] background: emulation paused\\n");
                          ultramodern::set_app_paused(true);
                          break;
                      case SDL_APP_DIDENTERFOREGROUND: {
                          SDL_SysWMinfo info{};
                          SDL_VERSION(&info.version);
                          if (g_window != nullptr &&
                              SDL_GetWindowWMInfo(g_window, &info) == SDL_TRUE &&
                              info.subsystem == SDL_SYSWM_ANDROID &&
                              info.info.android.window != nullptr) {
                              wr64_android::publish_resume_window(info.info.android.window);
                              std::fprintf(stderr, "[wr64-android] foreground: replacement window published\\n");
                              ultramodern::set_app_paused(false);
                          }
                          else {
                              std::fprintf(stderr, "[wr64-android] foreground: no native window; waiting\\n");
                          }
                          break;
                      }
          '''
          edit(cb, "        switch (event.type) {\n", "        switch (event.type) {\n#if defined(__ANDROID__)\n" + event_cases + "#endif\n", "Android lifecycle cases")

          ren = "upstream/src/renderer.cpp"
          edit(ren, "#include <chrono>\n", "#include <chrono>\n#if defined(__ANDROID__)\n#include <atomic>\n#include <android/native_window.h>\n#endif\n", "renderer lifecycle includes")
          pending = '''#if defined(__ANDROID__)
          namespace {
          std::atomic<void*> pending_resume_window{nullptr};
          }
          namespace wr64_android {
          void publish_resume_window(void* window) {
              ANativeWindow* nw = static_cast<ANativeWindow*>(window);
              if (nw != nullptr) ANativeWindow_acquire(nw);
              void* old = pending_resume_window.exchange(window, std::memory_order_acq_rel);
              if (old != nullptr) ANativeWindow_release(static_cast<ANativeWindow*>(old));
          }
          }
          #endif

          '''
          edit(ren, "namespace wr64 {\n\nRT64Context::RT64Context(", pending + "namespace wr64 {\n\nRT64Context::RT64Context(", "renderer pending window slot")
          consume = '''#if defined(__ANDROID__)
                  if (void* nw = pending_resume_window.exchange(nullptr, std::memory_order_acq_rel)) {
                      if (app_ && app_->swapChain != nullptr) {
                          app_->swapChain->setRenderWindow(static_cast<ANativeWindow*>(nw));
                      }
                      else {
                          ANativeWindow_release(static_cast<ANativeWindow*>(nw));
                      }
                  }
          #endif
          '''
          edit(ren, "        app_->updateScreen();", consume + "        app_->updateScreen();", "graphics window handoff")

          pl = Path("upstream/lib/RT64/src/contrib/plume")
          interface = str(pl / "plume_render_interface.h")
          edit(interface, "        virtual RenderWindow getWindow() const = 0;\n", "        virtual RenderWindow getWindow() const = 0;\n        virtual void setRenderWindow(RenderWindow window) { (void)window; }\n", "swapchain window API")
          vh = str(pl / "plume_vulkan.h")
          edit(vh, "#include <mutex>\n", "#include <atomic>\n#include <mutex>\n", "plume atomic include")
          edit(vh, "        RenderWindow getWindow() const override;\n", "        RenderWindow getWindow() const override;\n        void setRenderWindow(RenderWindow window) override;\n", "vulkan window API")
          edit(vh, "        void releaseImageViews();\n", "        void releaseImageViews();\n#if defined(__ANDROID__)\n        bool recreateSurface();\n        std::atomic<RenderWindow> pendingRenderWindow{nullptr};\n#endif\n", "vulkan pending window")
          vc = str(pl / "plume_vulkan.cpp")
          edit(vc, "        this->desc = desc;\n\n        VkResult res;", "        this->desc = desc;\n#if defined(__ANDROID__)\n        if (this->desc.renderWindow != nullptr) ANativeWindow_acquire(this->desc.renderWindow);\n#endif\n\n        VkResult res;", "initial native window ownership")
          edit(vc, "        // Remove tracking from the parent command queue.\n        commandQueue->swapChains.erase(this);", "#if defined(__ANDROID__)\n        if (desc.renderWindow != nullptr) ANativeWindow_release(desc.renderWindow);\n        if (RenderWindow pending = pendingRenderWindow.exchange(nullptr)) ANativeWindow_release(pending);\n#endif\n        // Remove tracking from the parent command queue.\n        commandQueue->swapChains.erase(this);", "release owned native windows")
          edit(vc, "    bool VulkanSwapChain::resize() {\n", "    bool VulkanSwapChain::resize() {\n#if defined(__ANDROID__)\n        if (pendingRenderWindow.load() != nullptr && !recreateSurface()) return false;\n        if (surface == VK_NULL_HANDLE) return false;\n#endif\n", "surface rebuild before resize")
          edit(vc, "        return (vk == VK_NULL_HANDLE) || (windowWidth != width)", "#if defined(__ANDROID__)\n        if (pendingRenderWindow.load() != nullptr) return true;\n#endif\n        return (vk == VK_NULL_HANDLE) || (windowWidth != width)", "pending resize trigger")
          edit(vc, "    bool VulkanSwapChain::isEmpty() const {", "    void VulkanSwapChain::setRenderWindow(RenderWindow window) {\n#   if defined(__ANDROID__)\n        // `window` arrives with a ref the host already owns on our behalf (the\n        // host acquired it at publish); storing it transfers that ref into the\n        // pendingRenderWindow slot. If a prior resume window is still queued here\n        // (the present thread hasn't consumed it yet), release our ref on it --\n        // it is being superseded and will never be adopted. Stashed for the\n        // present thread to consume in resize(); do not touch Vulkan objects here\n        // (this is called from the gfx thread).\n        // Always release the displaced ref, even if prev == window: prev and\n        // window each carried their own owned ref, and only one slot remains.\n        // The just-stored ref keeps the window alive.\n        if (RenderWindow prev = pendingRenderWindow.exchange(window)) {\n            ANativeWindow_release(prev);\n        }\n#   else\n        (void)window;\n#   endif\n    }\n\n#   if defined(__ANDROID__)\n    // Rebuild the VkSurfaceKHR from a fresh ANativeWindow after Android destroyed\n    // and recreated the app surface across a background/resume. Runs on the present\n    // thread (the swap chain's owner) from resize().\n    //\n    // KNOWN BOUNDED WINDOW (intentionally not fully closed):\n    // Between SDL's onNativeSurfaceDestroyed returning to Android and the present\n    // thread parking (it stops getting work once the VI thread pauses on\n    // WILLENTERBACKGROUND), a present already in flight can still touch the old\n    // surface. Four facts make this safe-and-bounded rather than a defect:\n    //   1. Memory safety is SOURCE-VERIFIED, not merely spec-implied. On Android,\n    //      vkCreateAndroidSurfaceKHR lives in the platform libvulkan WSI\n    //      (AOSP frameworks/native/vulkan/libvulkan/swapchain.cpp), NOT the Adreno\n    //      vendor blob. The Surface struct holds the window as sp<ANativeWindow>,\n    //      taking a refcount at surface creation and dropping it at\n    //      vkDestroySurfaceKHR. SDL's own ANativeWindow_release at surfaceDestroyed\n    //      therefore cannot free the window out from under an in-flight present ->\n    //      no use-after-free, independent of the frozen driver.\n    //   2. The contract-violation itself (touching the surface after\n    //      surfaceDestroyed returns) degrades gracefully PLATFORM-WIDE: an abandoned\n    //      Android BufferQueue returns errors (NO_INIT / OUT_OF_DATE) from dequeue\n    //      rather than faulting -- not an Adreno-specific mercy.\n    //   3. The window is bounded by work starvation: the VI-thread pause stops\n    //      ScreenUpdateActions, so the present thread drains at most ~1-2 residual\n    //      frames then blocks on its cursor condition.\n    //   4. The rigorous fix (block surfaceDestroyed on a present-in-flight handshake)\n    //      is IMPOSSIBLE without forking SDL: surfaceDestroyed is handled entirely\n    //      inside SDL's Java+native shim; we never run synchronously at that callsite\n    //      (we only see the async SDL_APP_WILLENTERBACKGROUND later on our event\n    //      pump). SDL itself uses a bounded-spin (backup_done, 50x10ms) at that same\n    //      callsite for its EGL path -- the very idiom we'd be replicating.\n    bool VulkanSwapChain::recreateSurface() {\n        RenderWindow newWindow = pendingRenderWindow.exchange(nullptr);\n        if (newWindow == nullptr) {\n            return false;\n        }\n\n        VulkanInterface *renderInterface = commandQueue->device->renderInterface;\n\n        // Adopt the new window NOW, before tearing down the old surface (P1 fix).\n        // vkDestroySurfaceKHR below drops libvulkan's ref on the OLD window, and\n        // SDL has already dropped its own (~500ms after surfaceDestroyed), so the\n        // old window can be freed the instant its surface dies. If a subsequent\n        // vkCreateAndroidSurfaceKHR failed while desc.renderWindow still pointed\n        // at that freed window, needsResize()/getWindowSize() would deref it at\n        // frame rate. Pointing desc.renderWindow at newWindow -- which we own a\n        // ref on (transferred from the pendingRenderWindow slot) -- keeps every\n        // deref safe whether or not the bind below succeeds. The replaced\n        // window's ref is released unconditionally: newWindow's ref, now living\n        // in desc.renderWindow, keeps it alive even if old == newWindow. Net ref\n        // move, no leak. (See the ownership invariant in the constructor.)\n        if (desc.renderWindow != nullptr) {\n            ANativeWindow_release(desc.renderWindow);\n        }\n        desc.renderWindow = newWindow;\n\n        // Tear down everything that referenced the old (destroyed) surface.\n        releaseImageViews();\n        releaseSwapChain();\n        if (surface != VK_NULL_HANDLE) {\n            vkDestroySurfaceKHR(renderInterface->instance, surface, nullptr);\n            surface = VK_NULL_HANDLE;\n        }\n\n        // The old swap chain handle is meaningless once the surface is gone.\n        createInfo.oldSwapchain = VK_NULL_HANDLE;\n\n        VkAndroidSurfaceCreateInfoKHR surfaceCreateInfo = {};\n        surfaceCreateInfo.sType = VK_STRUCTURE_TYPE_ANDROID_SURFACE_CREATE_INFO_KHR;\n        surfaceCreateInfo.window = newWindow;\n        VkResult res = vkCreateAndroidSurfaceKHR(renderInterface->instance, &surfaceCreateInfo, nullptr, &surface);\n        if (res != VK_SUCCESS) {\n            // desc.renderWindow already points at newWindow (a window we own a ref\n            // on), so this failure path is deref-safe; needsResize() keeps\n            // returning true so resize() retries, and re-publishing a window sets\n            // pendingRenderWindow again for another attempt.\n            fprintf(stderr, \"recreateSurface: vkCreateAndroidSurfaceKHR failed with error code 0x%X.\\n\", res);\n            surface = VK_NULL_HANDLE;\n            return false;\n        }\n\n        VkBool32 presentSupported = false;\n        vkGetPhysicalDeviceSurfaceSupportKHR(commandQueue->device->physicalDevice, commandQueue->familyIndex, surface, &presentSupported);\n        if (!presentSupported) {\n            fprintf(stderr, \"recreateSurface: recreated surface does not support present.\\n\");\n            return false;\n        }\n\n        fprintf(stderr, \"[plume] surface recreated from new ANativeWindow %p\\n\", (void *)newWindow);\n        return true;\n    }\n#   endif\n\n" + "    bool VulkanSwapChain::isEmpty() const {", "donor window handoff and surface rebuild")

          # v23: donor guard for transient/invalid Android swapchains.
          # If resize() fails during background surface loss, `vk` can remain
          # non-null, so isEmpty() alone is not sufficient. Never present from
          # released image views while swapChainValid is false.
          pq = "upstream/lib/RT64/src/hle/rt64_present_queue.cpp"
          edit(
              pq,
              "                skipPresent = skipPresent || ext.swapChain->isEmpty();",
              "                skipPresent = skipPresent || ext.swapChain->isEmpty() || !swapChainValid;",
              "Android invalid-swapchain present guard",
          )

          print("v23 suspend/resume present guard applied")
          PY

          # Initial bring-up does not need the desktop RecompFrontend UI.
          sed -i "s/'-DWR64_WITH_FRONTEND=ON'/'-DWR64_WITH_FRONTEND=OFF'/" android/app/build.gradle
          grep -q -- "-DWR64_WITH_FRONTEND=OFF" android/app/build.gradle

          # Do not run desktop replacement-asset validation/staging for the APK.
          python3 - <<'PY'
          from pathlib import Path
          NL = chr(10)
          p = Path("upstream/CMakeLists.txt")
          s = p.read_text()
          old = NL.join([
              "if(WR64_WITH_RUNTIME AND WR64_WITH_RECOMPILED)",
              "    find_package(Python3 REQUIRED COMPONENTS Interpreter)",
              "    # These tracked replacements",
          ])
          new = NL.join([
              "if(WR64_WITH_RUNTIME AND WR64_WITH_RECOMPILED AND NOT ANDROID)",
              "    find_package(Python3 REQUIRED COMPONENTS Interpreter)",
              "    # These tracked replacements",
          ])
          count = s.count(old)
          if count != 1:
              raise SystemExit(f"Wave Race asset-staging guard: expected one match, found {count}")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Android port preflight
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking only hard invariants; patch application itself already validates every transformation."

          test "$(git -C upstream/lib/RT64 rev-parse HEAD)" = "5473732a822a4423b5696e7cb18fecc425a59875"
          test "$(git -C upstream/lib/RT64/src/contrib/plume rev-parse HEAD)" = "d890ac899e505fb30040e037a4037cdeca68f033"

          test -f upstream/lib/RT64/src/shared/rt64_water_params.h
          test -f upstream/lib/RT64/src/render/rt64_water_renderer.cpp
          test -f upstream/lib/RT64/src/shaders/WaterVS.hlsl
          test -f upstream/src/android/nfd_android_stub.cpp
          grep -q "core.window = wmInfo.info.android.window" upstream/src/renderer.cpp
          grep -q "app_config.detectDataPath = false" upstream/src/renderer.cpp
          grep -q "Play imported ROM" android/app/src/main/java/com/hllartyparty/waverace64recomp/LauncherActivity.java
          grep -q "persistent native log started" upstream/src/main.cpp
          grep -q "void android_stage(const char\* stage);" upstream/src/main.cpp
          grep -q "FATAL SIGNAL" upstream/src/main.cpp
          grep -q "RT64 setup returned" upstream/src/renderer.cpp
          grep -q "Show last crash log" android/app/src/main/java/com/hllartyparty/waverace64recomp/LauncherActivity.java
          grep -q "before SDLActivity super.onCreate" android/app/src/main/java/com/hllartyparty/waverace64recomp/GameActivity.java
          grep -A2 "#if defined(__ANDROID__)" upstream/src/callbacks.cpp | grep -q "flags |= SDL_WINDOW_VULKAN"
          grep -q "build v23; SDL window flags" upstream/src/callbacks.cpp
          grep -q "const bool fullscreen = true;" upstream/src/callbacks.cpp
          grep -q "display defaults: Vulkan, expand, HUD 16:9" upstream/src/renderer.cpp
          grep -q "swapchain %ux%u" upstream/src/renderer.cpp
          grep -q "\[wr64-perf\]" upstream/src/renderer.cpp
          grep -q "SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION" android/app/src/main/java/com/hllartyparty/waverace64recomp/GameActivity.java
          grep -q "onWindowFocusChanged" android/app/src/main/java/com/hllartyparty/waverace64recomp/GameActivity.java
          grep -Fq 'android-arm64-vulkanfix1' scripts/setup_android_deps.sh
          grep -Fq "Android_Window->flags & SDL_WINDOW_OPENGL" scripts/setup_android_deps.sh
          grep -q "set_app_paused(true)" upstream/src/callbacks.cpp
          grep -q "publish_resume_window" upstream/src/renderer.cpp
          grep -q "wait_while_app_paused" upstream/lib/N64ModernRuntime/ultramodern/src/events.cpp
          grep -q "set_exited_and_wake" upstream/lib/N64ModernRuntime/librecomp/src/recomp.cpp
          grep -q "ANativeWindow_acquire" upstream/lib/RT64/src/contrib/plume/plume_vulkan.cpp
          grep -q "recreateSurface()" upstream/lib/RT64/src/contrib/plume/plume_vulkan.cpp
          grep -q "pendingRenderWindow.load()" upstream/lib/RT64/src/contrib/plume/plume_vulkan.cpp
          grep -Fq "skipPresent = skipPresent || ext.swapChain->isEmpty() || !swapChainValid;" upstream/lib/RT64/src/hle/rt64_present_queue.cpp
          bash -n scripts/setup_android_deps.sh

          # Android must stay on Plume's native ANativeWindow path. The RT64 SDL
          # Vulkan compile definition is intentionally Linux-only.
          if grep -q "if (ANDROID AND RT64_SDL_WINDOW_VULKAN)" upstream/lib/RT64/CMakeLists.txt; then
            echo "::error::Unexpected Android RT64_SDL_WINDOW_VULKAN compile-definition block."
            exit 24
          fi

          grep -q -- "-DWR64_WITH_FRONTEND=OFF" android/app/build.gradle

          git -C upstream/lib/RT64 diff --check
          git -C upstream/lib/N64ModernRuntime diff --check

          echo "Preflight passed."

      - name: Build Android SDL2 and FreeType
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(scripts/setup_android_deps.sh)"
          printf '%s\n' "$OUT"

          SDL_PREFIX="$(printf '%s\n' "$OUT" | sed -n 's/^WR64_ANDROID_SDL2_PREFIX=//p' | tail -n1)"
          FT_PREFIX="$(printf '%s\n' "$OUT" | sed -n 's/^WR64_ANDROID_FREETYPE_PREFIX=//p' | tail -n1)"

          test -n "$SDL_PREFIX"
          test -n "$FT_PREFIX"

          echo "WR64_ANDROID_SDL2_PREFIX=$SDL_PREFIX" >> "$GITHUB_ENV"
          echo "WR64_ANDROID_FREETYPE_PREFIX=$FT_PREFIX" >> "$GITHUB_ENV"

      - name: Build host file_to_c
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-host-tools
          c++ -std=c++17 -O2 \
            upstream/lib/RT64/src/tools/file_to_c/file_to_c.cpp \
            -o build-host-tools/file_to_c
          echo "WR64_ANDROID_FILE_TO_C=$GITHUB_WORKSPACE/build-host-tools/file_to_c" >> "$GITHUB_ENV"

      - name: Build ARM64 Android APK
        shell: bash
        run: |
          set -euo pipefail
          echo "Build matrix: arm64-v8a / API 28 / NDK 27.1.12297006 / CMake 3.22.1 / RelWithDebInfo"
          gradle -p android :app:assembleDebug --stacktrace --no-daemon

      - name: Prove ROM was not packaged
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          unzip -l "$APK" > "$RUNNER_TEMP/apk-files.txt"
          if grep -Ei '\.(z64|n64|v64)$|baserom|waverace_revA' "$RUNNER_TEMP/apk-files.txt"; then
            echo "::error::A ROM-like file unexpectedly appears inside the APK."
            exit 30
          fi
          echo "No ROM file is packaged in the APK."

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: WaveRace64Recomp-Android-arm64-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
