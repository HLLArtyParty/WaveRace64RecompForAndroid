name: Android bring-up v23 - suspend resume present guard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install host build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang lld cmake ninja-build git curl unzip zip xz-utils \
            python3 python3-venv python3-dev binutils-mips-linux-gnu openssl

      - name: Locate and install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $ANDROID_HOME"
            exit 10
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.1.12297006"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Decrypt and verify private Rev A build input
        shell: bash
        env:
          WR64_ROM_KEY: ${{ secrets.WR64_ROM_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${WR64_ROM_KEY:-}" ]; then
            echo "::error::Repository secret WR64_ROM_KEY is missing."
            exit 11
          fi
          if [ ! -f waverace_revA.z64.enc ]; then
            echo "::error::Encrypted ROM input waverace_revA.z64.enc is missing from repo root."
            exit 12
          fi

          mkdir -p "$RUNNER_TEMP/wr64-private"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass env:WR64_ROM_KEY \
            -in waverace_revA.z64.enc \
            -out "$RUNNER_TEMP/wr64-private/waverace_revA.z64"

          ACTUAL="$(sha1sum "$RUNNER_TEMP/wr64-private/waverace_revA.z64" | awk '{print $1}')"
          EXPECTED="508dfc2d4caa42b6f6de5263d0aed5e44ac7966a"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Decrypted ROM hash mismatch."
            exit 13
          fi
          echo "Verified Wave Race 64 USA Rev A build input."

      - name: Clone pinned Wave Race source and submodules
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/elliotttate/wave-race-64-recomp.git upstream
          git -C upstream checkout --detach 9041cc8024f6d2015859f88f5a0307b36cd4e50a
          git -C upstream submodule update --init --recursive

          mkdir -p upstream/reference
          git clone https://github.com/LLONSIT/Wave-Race-64.git upstream/reference/wr64-decomp
          git -C upstream/reference/wr64-decomp checkout --detach a51b38a2aaef68da10ea1e47247e70be3b1d4c70

      - name: Build N64 recompilers and generate Wave Race native sources
        shell: bash
        run: |
          set -euo pipefail

          python3 -m venv "$RUNNER_TEMP/wr64venv"
          "$RUNNER_TEMP/wr64venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/wr64venv/bin/pip" install \
            PyYAML==6.0.3 pylibyaml==0.1.0 tqdm==4.67.1 \
            intervaltree==3.1.0 colorama==0.4.6 spimdisasm==1.42.4 \
            rabbitizer==1.16.2 pygfxd==1.0.5 n64img==0.3.3 crunch64==0.6.2

          cd upstream
          python3 tools/patch_n64recomp.py
          python3 tools/patch_rsprecomp.py

          cmake \
            -S lib/N64ModernRuntime/N64Recomp \
            -B build-tools \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++
          cmake --build build-tools --target N64RecompCLI RSPRecomp --parallel 4

          "$RUNNER_TEMP/wr64venv/bin/python" tools/generate_game.py \
            "$RUNNER_TEMP/wr64-private/waverace_revA.z64"

          test -f RecompiledFuncs/funcs.h
          test -f RecompiledFuncs/aspMain_rsp.cpp
          if ! compgen -G 'RecompiledFuncs/*.c' >/dev/null; then
            echo "::error::N64Recomp produced no game C sources."
            exit 20
          fi

          # The raw ROM is only needed for generation. Remove it before Android packaging.
          rm -f "$RUNNER_TEMP/wr64-private/waverace_revA.z64"
          rm -f reference/wr64-decomp/baserom.us.rev1.z64
          rm -f wr64.elf

      - name: Apply Wave Race runtime patches and Android compatibility
        shell: bash
        run: |
          set -euo pipefail

          cd upstream

          # Preserve the exact renderer stack this Wave Race revision was built against.
          test "$(git -C lib/RT64 rev-parse HEAD)" = "5473732a822a4423b5696e7cb18fecc425a59875"
          test "$(git -C lib/RT64/src/contrib/plume rev-parse HEAD)" = "d890ac899e505fb30040e037a4037cdeca68f033"

          # Apply Wave Race's own documented runtime patch stack first.
          python3 tools/patch_rt64.py
          python3 tools/patch_librecomp.py
          python3 tools/patch_water.py
          python3 tools/patch_runtime_shutdown.py

          test -f lib/RT64/src/shared/rt64_water_params.h
          test -f lib/RT64/src/render/rt64_water_renderer.cpp
          test -f lib/RT64/src/shaders/WaterVS.hlsl

          cd ..

          # Layer generic Android changes onto Wave Race's pinned RT64.
          # NL=chr(10) deliberately avoids brittle escaped-newline matching.
          python3 - <<'PY'
          from pathlib import Path

          NL = chr(10)

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          rt = Path("upstream/lib/RT64")

          # ---- RT64 CMake ---------------------------------------------------
          p = rt / "CMakeLists.txt"
          text = p.read_text()

          old = NL.join([
              "else()",
              '    if (CMAKE_SYSTEM_PROCESSOR STREQUAL "x86_64")',
              '        set (DXC "LD_LIBRARY_PATH=${PROJECT_SOURCE_DIR}/src/contrib/dxc/lib/x64" "${PROJECT_SOURCE_DIR}/src/contrib/dxc/bin/x64/dxc-linux")',
          ])
          new = NL.join([
              "else()",
              '    if (CMAKE_HOST_SYSTEM_PROCESSOR STREQUAL "x86_64" OR CMAKE_HOST_SYSTEM_PROCESSOR STREQUAL "AMD64")',
              '        set (DXC "LD_LIBRARY_PATH=${PROJECT_SOURCE_DIR}/src/contrib/dxc/lib/x64" "${PROJECT_SOURCE_DIR}/src/contrib/dxc/bin/x64/dxc-linux")',
          ])
          text = once(text, old, new, "host DXC selection")

          old = NL.join([
              "set(ZSTD_LEGACY_SUPPORT OFF)",
              "set(ZSTD_BUILD_STATIC ON)",
              "set(ZSTD_BUILD_SHARED OFF)",
          ])
          new = NL.join([
              "set(ZSTD_LEGACY_SUPPORT OFF)",
              "set(ZSTD_BUILD_STATIC ON)",
              "set(ZSTD_BUILD_SHARED OFF)",
              "",
              "if(ANDROID)",
              '    set(ZSTD_BUILD_DICTBUILDER OFF CACHE BOOL "" FORCE)',
              '    set(ZSTD_BUILD_PROGRAMS OFF CACHE BOOL "" FORCE)',
              "endif()",
          ])
          text = once(text, old, new, "Android zstd options")

          text = once(
              text,
              "add_subdirectory(src/contrib/nativefiledialog-extended)",
              NL.join([
                  "if (NOT TARGET nfd)",
                  "    add_subdirectory(src/contrib/nativefiledialog-extended)",
                  "endif()",
              ]),
              "NFD target guard",
          )

          text = once(
              text,
              'set (DXC_COMMON_OPTS "-I${PROJECT_SOURCE_DIR}/src")',
              NL.join([
                  'set (DXC_COMMON_OPTS "-I${PROJECT_SOURCE_DIR}/src")',
                  "if (ANDROID)",
                  '    list(APPEND DXC_COMMON_OPTS "-D" "RT64_TEXTURE_CACHE_SIZE=1024")',
                  "endif()",
              ]),
              "Android shader texture cache",
          )

          text = once(
              text,
              "add_subdirectory(src/tools/file_to_c)",
              NL.join([
                  "if(ANDROID)",
                  "    if(NOT ZELDA_HOST_FILE_TO_C)",
                  '        message(FATAL_ERROR "Android cross-compile requires -DZELDA_HOST_FILE_TO_C=/path/to/host/file_to_c")',
                  "    endif()",
                  '    set(FILE_TO_C "${ZELDA_HOST_FILE_TO_C}")',
                  '    set(FILE_TO_C_DEP "${ZELDA_HOST_FILE_TO_C}")',
                  "else()",
                  "    add_subdirectory(src/tools/file_to_c)",
                  "    set(FILE_TO_C file_to_c)",
                  "    set(FILE_TO_C_DEP file_to_c)",
                  "endif()",
              ]),
              "host file_to_c setup",
          )

          file_to_c_count = text.count("COMMAND file_to_c ")
          if file_to_c_count != 4:
              raise SystemExit(f"host file_to_c commands: expected four, found {file_to_c_count}")
          text = text.replace("COMMAND file_to_c ", "COMMAND ${FILE_TO_C} ")

          file_to_c_dep_count = text.count(" file_to_c" + NL)
          if file_to_c_dep_count != 4:
              raise SystemExit(f"host file_to_c dependencies: expected four, found {file_to_c_dep_count}")
          text = text.replace(" file_to_c" + NL, " ${FILE_TO_C_DEP}" + NL)

          p.write_text(text)

          # ---- Descriptor pressure on mobile Vulkan ------------------------
          p = rt / "src/render/rt64_descriptor_sets.h"
          text = p.read_text()
          text = once(
              text,
              "        static const int UpperRange = 8192;",
              NL.join([
                  "#if defined(__ANDROID__)",
                  "        static const int UpperRange = 1024;",
                  "#else",
                  "        static const int UpperRange = 8192;",
                  "#endif",
              ]),
              "Android descriptor upper range",
          )
          text = once(
              text,
              "            builder.end(true, textureCacheSize);",
              NL.join([
                  "#if defined(__ANDROID__)",
                  "            builder.end();",
                  "#else",
                  "            builder.end(true, textureCacheSize);",
                  "#endif",
              ]),
              "Android descriptor variable-count mode",
          )
          p.write_text(text)

          p = rt / "src/shaders/FbRendererCommon.hlsli"
          text = p.read_text()
          text = once(
              text,
              "// Set 1 - RGBA32 texture cache.",
              NL.join([
                  "#ifndef RT64_TEXTURE_CACHE_SIZE",
                  "#define RT64_TEXTURE_CACHE_SIZE 8192",
                  "#endif",
                  "",
                  "// Set 1 - RGBA32 texture cache.",
              ]),
              "shader descriptor macro",
          )
          text = once(
              text,
              "Texture2D<float4> gTextures[8192] : register(t0, space1);",
              "Texture2D<float4> gTextures[RT64_TEXTURE_CACHE_SIZE] : register(t0, space1);",
              "shader RGBA descriptor range",
          )
          text = once(
              text,
              "Texture1D<uint> gTMEM[8192] : register(t0, space2);",
              "Texture1D<uint> gTMEM[RT64_TEXTURE_CACHE_SIZE] : register(t0, space2);",
              "shader TMEM descriptor range",
          )
          p.write_text(text)

          p = rt / "src/render/rt64_framebuffer_renderer.cpp"
          text = p.read_text()
          text = once(
              text,
              "            descTextureSet = std::make_unique<FramebufferRendererDescriptorTextureSet>(worker->device, ((textureCacheSize + 1) * 3) / 2);",
              NL.join([
                  "#if defined(__ANDROID__)",
                  "            descTextureSet = std::make_unique<FramebufferRendererDescriptorTextureSet>(worker->device, FramebufferRendererDescriptorTextureSet::UpperRange);",
                  "#else",
                  "            descTextureSet = std::make_unique<FramebufferRendererDescriptorTextureSet>(worker->device, ((textureCacheSize + 1) * 3) / 2);",
                  "#endif",
              ]),
              "Android descriptor allocation",
          )
          p.write_text(text)

          # ---- Android SDL window -> ANativeWindow -------------------------
          p = rt / "src/hle/rt64_application_window.cpp"
          text = p.read_text()

          text = once(
              text,
              "#elif defined(__linux__)",
              NL.join([
                  "#elif defined(__ANDROID__)",
                  "#   include <android/native_window.h>",
                  "#elif defined(__linux__)",
              ]),
              "Android native-window include",
          )

          old = NL.join([
              "#   elif defined(__ANDROID__)",
              '        static_assert(false && "Android unimplemented");',
              "#   elif defined(__linux__) || defined(__APPLE__)",
          ])
          new = NL.join([
              "#   elif defined(__ANDROID__)",
              "        if (SDL_VideoInit(nullptr) != 0) {",
              '            printf("Failed to init SDL2 video: %s\\n", SDL_GetError());',
              '            assert(false && "Failed to init SDL2 video");',
              "            return;",
              "        }",
              "        SDL_DisplayMode dm = {};",
              "        if (SDL_GetCurrentDisplayMode(0, &dm) != 0) {",
              '            printf("Failed to get SDL2 current display mode: %s\\n", SDL_GetError());',
              '            assert(false && "Failed to get SDL2 current display mode");',
              "            return;",
              "        }",
              "        bounds.left = 0;",
              "        bounds.top = 0;",
              "        bounds.width = dm.w;",
              "        bounds.height = dm.h;",
              "#   elif defined(__linux__) || defined(__APPLE__)",
          ])
          text = once(text, old, new, "Android window bounds")

          old = NL.join([
              "#   elif defined(RT64_SDL_WINDOW_VULKAN)",
              "        windowHandle = sdlWindow;",
              "#   elif defined(__ANDROID__)",
              '        static_assert(false && "Android unimplemented");',
              "#   elif defined(__linux__)",
          ])
          new = NL.join([
              "#   elif defined(__ANDROID__)",
              "        assert(wmInfo.subsystem == SDL_SYSWM_ANDROID);",
              "        windowHandle = wmInfo.info.android.window;",
              "#   elif defined(RT64_SDL_WINDOW_VULKAN)",
              "        windowHandle = sdlWindow;",
              "#   elif defined(__linux__)",
          ])
          text = once(text, old, new, "Android native window handle")

          old = NL.join([
              "        fullScreen = newFullScreen;",
              "#   elif defined(__APPLE__)",
              "        windowWrapper->toggleFullscreen();",
          ])
          new = NL.join([
              "        fullScreen = newFullScreen;",
              "#   elif defined(__ANDROID__)",
              "        fullScreen = newFullScreen;",
              "#   elif defined(__APPLE__)",
              "        windowWrapper->toggleFullscreen();",
          ])
          text = once(text, old, new, "Android fullscreen state")

          old = NL.join([
              "#   elif defined(__linux__)",
              "        // Sourced from: https://stackoverflow.com/a/66865623",
          ])
          new = NL.join([
              "#   elif defined(__ANDROID__)",
              "        int displayIndex = (sdlWindow != nullptr) ? SDL_GetWindowDisplayIndex(sdlWindow) : 0;",
              "        if (displayIndex < 0) displayIndex = 0;",
              "        SDL_DisplayMode displayMode = {};",
              "        if (SDL_GetCurrentDisplayMode(displayIndex, &displayMode) == 0) {",
              "            refreshRate = displayMode.refresh_rate;",
              "        }",
              "#   elif defined(__linux__)",
              "        // Sourced from: https://stackoverflow.com/a/66865623",
          ])
          text = once(text, old, new, "Android refresh-rate query")

          old = NL.join([
              "#   elif defined(RT64_SDL_WINDOW_VULKAN)",
              "        SDL_GetWindowPosition(windowHandle, &newWindowLeft, &newWindowTop);",
              "#   elif defined(__linux__)",
          ])
          new = NL.join([
              "#   elif defined(__ANDROID__)",
              "        return false;",
              "#   elif defined(RT64_SDL_WINDOW_VULKAN)",
              "        SDL_GetWindowPosition(windowHandle, &newWindowLeft, &newWindowTop);",
              "#   elif defined(__linux__)",
          ])
          text = once(text, old, new, "Android window-move query")

          p.write_text(text)

          # Android phone/tablet Vulkan surfaces conventionally expose RGBA.
          p = rt / "src/hle/rt64_application.cpp"
          text = p.read_text()
          text = once(
              text,
              "        swapChainDesc.format = RenderFormat::B8G8R8A8_UNORM;",
              NL.join([
                  "#if defined(__ANDROID__)",
                  "        swapChainDesc.format = RenderFormat::R8G8B8A8_UNORM;",
                  "#else",
                  "        swapChainDesc.format = RenderFormat::B8G8R8A8_UNORM;",
                  "#endif",
              ]),
              "Android swap-chain format",
          )
          p.write_text(text)
          PY

          python3 overlay/apply_android_overlay.py upstream

          # Wave Race's desktop renderer passes ultramodern's SDL_Window*
          # directly into RT64. On Android, RT64/Plume's RenderWindow is an
          # ANativeWindow*, so bridge through SDL_SysWMinfo. This matches the
          # proven Goemon64Recomp-Android integration.
          python3 - <<'PY'
          from pathlib import Path

          NL = chr(10)
          p = Path("upstream/src/renderer.cpp")
          text = p.read_text()

          include_anchor = NL.join([
              '#include <cstdio>',
              '#include <librecomp/game.hpp>',
          ])
          include_replacement = NL.join([
              '#include <cstdio>',
              '#include <librecomp/game.hpp>',
              '',
              '#if defined(__ANDROID__)',
              '#   include <SDL.h>',
              '#   include <SDL_syswm.h>',
              '#endif',
          ])

          count = text.count(include_anchor)
          if count != 1:
              raise SystemExit(f"renderer Android include anchor: expected one match, found {count}")
          text = text.replace(include_anchor, include_replacement, 1)

          window_anchor = NL.join([
              '#if defined(__APPLE__)',
              '    core.window.window = window_handle.window;',
              '    core.window.view = window_handle.view;',
              '#elif defined(_WIN32)',
              '    core.window = window_handle.window;',
              '#else',
              '    core.window = window_handle;',
              '#endif',
          ])
          window_replacement = NL.join([
              '#if defined(__APPLE__)',
              '    core.window.window = window_handle.window;',
              '    core.window.view = window_handle.view;',
              '#elif defined(_WIN32)',
              '    core.window = window_handle.window;',
              '#elif defined(__ANDROID__)',
              '    {',
              '        SDL_SysWMinfo wmInfo;',
              '        SDL_VERSION(&wmInfo.version);',
              '        SDL_GetWindowWMInfo(window_handle, &wmInfo);',
              '        core.window = wmInfo.info.android.window;',
              '    }',
              '#else',
              '    core.window = window_handle;',
              '#endif',
          ])

          count = text.count(window_anchor)
          if count != 1:
              raise SystemExit(f"renderer Android window bridge anchor: expected one match, found {count}")
          text = text.replace(window_anchor, window_replacement, 1)

          p.write_text(text)
          PY

          # Android runtime fixes:
          # 1) RT64 must use our writable app-private data directory instead of
          #    platform auto-detection.
          # 2) Keep the launcher visible when a ROM is already cached so a native
          #    crash cannot trap the app in an automatic relaunch loop.
          python3 - <<'PY'
          from pathlib import Path

          NL = chr(10)

          # ---- RT64 application data path -----------------------------------
          p = Path("upstream/src/renderer.cpp")
          text = p.read_text()

          include_anchor = '#include <cstdio>'
          include_replacement = NL.join([
              '#include <cstdio>',
              '#include <cstdlib>',
          ])
          count = text.count(include_anchor)
          if count != 1:
              raise SystemExit(f"renderer cstdlib include anchor: expected one match, found {count}")
          text = text.replace(include_anchor, include_replacement, 1)

          cfg_anchor = NL.join([
              '    RT64::ApplicationConfiguration app_config{};',
              '    app_config.appId = "WaveRace64Recomp";',
              '    app_config.useConfigurationFile = true;',
          ])
          cfg_replacement = NL.join([
              '    RT64::ApplicationConfiguration app_config{};',
              '    app_config.appId = "WaveRace64Recomp";',
              '    app_config.useConfigurationFile = true;',
              '#if defined(__ANDROID__)',
              '    if (const char* android_data_dir = std::getenv("WR64_ANDROID_DATA_DIR");',
              "        android_data_dir != nullptr && android_data_dir[0] != '\\0') {",
              '        app_config.detectDataPath = false;',
              '        app_config.dataPath = android_data_dir;',
              '    }',
              '#endif',
          ])
          count = text.count(cfg_anchor)
          if count != 1:
              raise SystemExit(f"RT64 Android data-path anchor: expected one match, found {count}")
          text = text.replace(cfg_anchor, cfg_replacement, 1)
          p.write_text(text)

          # ---- Safe launcher -------------------------------------------------
          p = Path("android/app/src/main/java/com/hllartyparty/waverace64recomp/LauncherActivity.java")
          text = p.read_text()

          launcher_anchor = '        if (installed.isFile()) launch(installed);'
          launcher_replacement = NL.join([
              '        if (installed.isFile()) {',
              '            status.setText("ROM imported. Tap Play to launch, or Select ROM to replace it.");',
              '            Button play = new Button(this);',
              '            play.setText("Play imported ROM");',
              '            play.setOnClickListener(v -> launch(installed));',
              '            box.addView(play);',
              '        }',
          ])
          count = text.count(launcher_anchor)
          if count != 1:
              raise SystemExit(f"safe-launcher anchor: expected one match, found {count}")
          text = text.replace(launcher_anchor, launcher_replacement, 1)
          p.write_text(text)
          PY

          # SDL 2.32.10 Android lifecycle fix:
          # onNativeSurfaceChanged() recreates an EGL surface whenever
          # egl_surface == EGL_NO_SURFACE, without first checking that the
          # SDL window is actually an OpenGL window. On a Vulkan window this
          # steals the ANativeWindow and makes vkCreateAndroidSurfaceKHR return
          # VK_ERROR_NATIVE_WINDOW_IN_USE_KHR.
          python3 - <<'PY'
          from pathlib import Path

          p = Path("scripts/setup_android_deps.sh")
          text = p.read_text()

          old_prefix = 'SDL2_PREFIX="$PREFIX_ROOT/SDL2-${SDL2_VERSION}-android-arm64"'
          new_prefix = 'SDL2_PREFIX="$PREFIX_ROOT/SDL2-${SDL2_VERSION}-android-arm64-vulkanfix1"'
          if text.count(old_prefix) != 1:
              raise SystemExit(f"SDL prefix anchor: expected one match, found {text.count(old_prefix)}")
          text = text.replace(old_prefix, new_prefix, 1)

          tar_anchor = '  tar -xzf "SDL2-${SDL2_VERSION}.tar.gz"'
          patch_lines = [
              tar_anchor,
              '  SDL_ANDROID_C="SDL2-${SDL2_VERSION}/src/core/android/SDL_android.c"',
              '  python3 -c \'from pathlib import Path; import sys; p=Path(sys.argv[1]); s=p.read_text(); old="        if (data->egl_surface == EGL_NO_SURFACE) {"; new="        if ((Android_Window->flags & SDL_WINDOW_OPENGL) && data->egl_surface == EGL_NO_SURFACE) {"; assert s.count(old) == 1, f"SDL EGL guard anchor count: {s.count(old)}"; p.write_text(s.replace(old, new, 1))\' "$SDL_ANDROID_C"',
              '  grep -Fq \'if ((Android_Window->flags & SDL_WINDOW_OPENGL) && data->egl_surface == EGL_NO_SURFACE) {\' "$SDL_ANDROID_C"',
              '  echo "Patched SDL Android surfaceChanged EGL recreation guard."',
          ]
          replacement = "\n".join(patch_lines)

          if text.count(tar_anchor) != 1:
              raise SystemExit(f"SDL tar anchor: expected one match, found {text.count(tar_anchor)}")
          text = text.replace(tar_anchor, replacement, 1)
          p.write_text(text)
          PY

          # Android SDL must be told this is a Vulkan window. If no graphics
          # backend flag is supplied, SDL 2.32 defaults Android windows to
