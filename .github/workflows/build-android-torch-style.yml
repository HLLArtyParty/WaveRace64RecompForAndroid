name: Android bring-up

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install host build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang lld cmake ninja-build git curl unzip zip xz-utils \
            python3 python3-venv python3-dev binutils-mips-linux-gnu openssl

      - name: Locate and install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $ANDROID_HOME"
            exit 10
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.1.12297006"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Decrypt and verify private Rev A build input
        shell: bash
        env:
          WR64_ROM_KEY: ${{ secrets.WR64_ROM_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${WR64_ROM_KEY:-}" ]; then
            echo "::error::Repository secret WR64_ROM_KEY is missing."
            exit 11
          fi
          if [ ! -f waverace_revA.z64.enc ]; then
            echo "::error::Encrypted ROM input waverace_revA.z64.enc is missing from repo root."
            exit 12
          fi

          mkdir -p "$RUNNER_TEMP/wr64-private"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass env:WR64_ROM_KEY \
            -in waverace_revA.z64.enc \
            -out "$RUNNER_TEMP/wr64-private/waverace_revA.z64"

          ACTUAL="$(sha1sum "$RUNNER_TEMP/wr64-private/waverace_revA.z64" | awk '{print $1}')"
          EXPECTED="508dfc2d4caa42b6f6de5263d0aed5e44ac7966a"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Decrypted ROM hash mismatch."
            exit 13
          fi
          echo "Verified Wave Race 64 USA Rev A build input."

      - name: Clone pinned Wave Race source and submodules
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/elliotttate/wave-race-64-recomp.git upstream
          git -C upstream checkout --detach 9041cc8024f6d2015859f88f5a0307b36cd4e50a
          git -C upstream submodule update --init --recursive

          mkdir -p upstream/reference
          git clone https://github.com/LLONSIT/Wave-Race-64.git upstream/reference/wr64-decomp
          git -C upstream/reference/wr64-decomp checkout --detach a51b38a2aaef68da10ea1e47247e70be3b1d4c70

      - name: Build N64 recompilers and generate Wave Race native sources
        shell: bash
        run: |
          set -euo pipefail

          python3 -m venv "$RUNNER_TEMP/wr64venv"
          "$RUNNER_TEMP/wr64venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/wr64venv/bin/pip" install \
            PyYAML==6.0.3 pylibyaml==0.1.0 tqdm==4.67.1 \
            intervaltree==3.1.0 colorama==0.4.6 spimdisasm==1.42.4 \
            rabbitizer==1.16.2 pygfxd==1.0.5 n64img==0.3.3 crunch64==0.6.2

          cd upstream
          python3 tools/patch_n64recomp.py
          python3 tools/patch_rsprecomp.py

          cmake \
            -S lib/N64ModernRuntime/N64Recomp \
            -B build-tools \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++
          cmake --build build-tools --target N64RecompCLI RSPRecomp --parallel 4

          "$RUNNER_TEMP/wr64venv/bin/python" tools/generate_game.py \
            "$RUNNER_TEMP/wr64-private/waverace_revA.z64"

          test -f RecompiledFuncs/funcs.h
          test -f RecompiledFuncs/aspMain_rsp.cpp
          if ! compgen -G 'RecompiledFuncs/*.c' >/dev/null; then
            echo "::error::N64Recomp produced no game C sources."
            exit 20
          fi

          # The raw ROM is only needed for generation. Remove it before Android packaging.
          rm -f "$RUNNER_TEMP/wr64-private/waverace_revA.z64"
          rm -f reference/wr64-decomp/baserom.us.rev1.z64
          rm -f wr64.elf

      - name: Switch RT64 to Android implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream/lib/RT64
          git clone https://github.com/linkzenic/rt64.git upstream/lib/RT64
          git -C upstream/lib/RT64 checkout --detach 86d20c83bd32059eda0e871a11805d08b0a1b367
          git -C upstream/lib/RT64 submodule update --init --recursive

          python3 overlay/apply_android_overlay.py upstream

          # Initial Android bring-up: use Java ROM picker, no desktop frontend.
          sed -i "s/'-DWR64_WITH_FRONTEND=ON'/'-DWR64_WITH_FRONTEND=OFF'/" android/app/build.gradle

          # Android should not try to stage desktop replacement soundtrack/HD texture bundle.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("upstream/CMakeLists.txt")
          s = p.read_text()
          s = s.replace(
              "if(WR64_WITH_RUNTIME AND WR64_WITH_RECOMPILED)\n    find_package(Python3 REQUIRED COMPONENTS Interpreter)\n    # These tracked replacements",
              "if(WR64_WITH_RUNTIME AND WR64_WITH_RECOMPILED AND NOT ANDROID)\n    find_package(Python3 REQUIRED COMPONENTS Interpreter)\n    # These tracked replacements",
              1,
          )
          p.write_text(s)
          PY

      - name: Build Android SDL2 and FreeType
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(scripts/setup_android_deps.sh)"
          printf '%s\n' "$OUT"

          SDL_PREFIX="$(printf '%s\n' "$OUT" | sed -n 's/^WR64_ANDROID_SDL2_PREFIX=//p' | tail -n1)"
          FT_PREFIX="$(printf '%s\n' "$OUT" | sed -n 's/^WR64_ANDROID_FREETYPE_PREFIX=//p' | tail -n1)"

          test -n "$SDL_PREFIX"
          test -n "$FT_PREFIX"

          echo "WR64_ANDROID_SDL2_PREFIX=$SDL_PREFIX" >> "$GITHUB_ENV"
          echo "WR64_ANDROID_FREETYPE_PREFIX=$FT_PREFIX" >> "$GITHUB_ENV"

      - name: Build host file_to_c
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-host-tools
          c++ -std=c++17 -O2 \
            upstream/lib/RT64/src/tools/file_to_c/file_to_c.cpp \
            -o build-host-tools/file_to_c
          echo "WR64_ANDROID_FILE_TO_C=$GITHUB_WORKSPACE/build-host-tools/file_to_c" >> "$GITHUB_ENV"

      - name: Build ARM64 Android APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android :app:assembleDebug --stacktrace --no-daemon

      - name: Prove ROM was not packaged
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          unzip -l "$APK" > "$RUNNER_TEMP/apk-files.txt"
          if grep -Ei '\.(z64|n64|v64)$|baserom|waverace_revA' "$RUNNER_TEMP/apk-files.txt"; then
            echo "::error::A ROM-like file unexpectedly appears inside the APK."
            exit 30
          fi
          echo "No ROM file is packaged in the APK."

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: WaveRace64Recomp-Android-arm64-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
